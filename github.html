<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ibraheem Muhammad's GitHub</title>
    <link rel="stylesheet" href="style.css"> <!-- Link to your stylesheet -->
    <link rel="stylesheet" href="styles.css"> <!-- Link to your common styles -->
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 0;
        }

        header {
            background: linear-gradient(135deg, #0072ff, #00c6ff);
            color: #fff;
            padding: 28px 20px;
            text-align: center;
        }

        header h1 {
            font-family: 'Orbitron', 'Arial', sans-serif;
            font-size: clamp(1.2rem, 4vw, 1.7rem);
            font-weight: 700;
            margin: 0;
            letter-spacing: 1px;
        }

        main {
            max-width: 700px;
            width: calc(100% - 40px);
            margin: 40px auto;
            padding: 40px;
            border-radius: 18px;
            background: rgba(8, 12, 30, 0.58);
            border: 1px solid rgba(0, 198, 255, 0.22);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            text-align: center;
        }

        h2 {
            font-family: 'Inter', 'Arial', sans-serif;
            font-size: 1.35rem;
            color: #00c6ff;
            margin-bottom: 14px;
        }

        p {
            text-align: left;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 28px;
        }

        .github-link {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #0072ff, #00c6ff);
            color: #fff;
            text-decoration: none;
            border-radius: 50px;
            font-family: 'Inter', 'Arial', sans-serif;
            font-weight: 600;
            font-size: 15px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 16px rgba(0, 114, 255, 0.35);
            margin-bottom: 14px;
        }

        .github-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(0, 198, 255, 0.55);
        }

        .back-to-home {
            display: inline-block;
            padding: 11px 26px;
            background: transparent;
            color: #00c6ff;
            text-decoration: none;
            border-radius: 50px;
            border: 1.5px solid rgba(0, 198, 255, 0.5);
            font-family: 'Inter', 'Arial', sans-serif;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            margin-left: 12px;
        }

        .back-to-home:hover {
            background: rgba(0, 198, 255, 0.1);
            box-shadow: 0 0 16px rgba(0, 198, 255, 0.3);
        }

        footer {
            margin-top: auto;
            padding: 20px;
            text-align: center;
            color: rgba(255, 255, 255, 0.45);
            font-size: 13px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Ibraheem Muhammad's GitHub</h1>
    </header>

    <main>
        <h2>Visit My GitHub Profile</h2>

        <p>You can explore my GitHub repositories by visiting the link below:</p>

        <a href="https://github.com/imuhammad23csuf" class="github-link" target="_blank">GitHub</a>
        <br>
        <a href="index.html" class="back-to-home">Back to Home</a>
    </main>

    <footer>
        <p>&copy; 2023 Ibraheem Muhammad. All rights reserved.</p>
    </footer>

</body>
</html>
