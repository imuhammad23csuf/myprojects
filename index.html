<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ibraheem Muhammad's Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styles.css">
    <!-- Favicon link -->
    <link rel="icon" href="IMG_0008.ico" type="image/x-icon">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        #home {
            width: 100%;
            max-width: 580px;
        }

        .hero-card {
            background: rgba(8, 12, 30, 0.58);
            border: 1px solid rgba(0, 198, 255, 0.22);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 52px 44px 44px;
        }

        .hero-eyebrow {
            font-family: 'Inter', 'Arial', sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(0, 198, 255, 0.85);
            margin-bottom: 14px;
        }

        h1 {
            font-family: 'Orbitron', 'Arial', sans-serif;
            font-size: clamp(1.6rem, 5vw, 2.4rem);
            font-weight: 700;
            background: linear-gradient(135deg, #00c6ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 16px;
            line-height: 1.25;
        }

        .hero-divider {
            width: 52px;
            height: 3px;
            background: linear-gradient(90deg, #0072ff, #00c6ff);
            border-radius: 2px;
            margin: 0 auto 20px;
        }

        p {
            margin-bottom: 36px;
            font-size: 16px;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.82);
        }

        nav {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        nav a {
            padding: 12px 26px;
            text-decoration: none;
            color: #fff;
            background: linear-gradient(135deg, #0072ff, #00c6ff);
            border-radius: 50px;
            font-family: 'Inter', 'Arial', sans-serif;
            font-weight: 600;
            font-size: 15px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 16px rgba(0, 114, 255, 0.35);
        }

        nav a:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(0, 198, 255, 0.55);
        }
    </style>
</head>
<body>

    <div id="home" class="section">
        <div class="hero-card fade-in">
            <p class="hero-eyebrow">Portfolio</p>
            <h1>Welcome to My Portfolio</h1>
            <div class="hero-divider"></div>
            <p>Explore exciting projects I've worked on, from animation to creating games.</p>

            <nav>
                <a href="projects.html">Projects</a>
                <a href="github.html">GitHub</a>
                <a href="about.html">About</a>
            </nav>
        </div>
    </div>

</body>
</html>
